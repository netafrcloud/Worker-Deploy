name: Deploy Single Worker

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Nama Worker'
        required: true
        type: string
      cloudflare_account_id:
        description: 'Cloudflare Account ID'
        required: true
        type: string
        default: '77e2de770501a064c346fcada3bd39d6'
      cloudflare_api_token:
        description: 'Cloudflare API Token'
        required: true
        type: string
        default: 'cfut_ZS4IykiQHwNIqBeNfgoMU24mePZ0zEXnCZ6DbNy9dab7538d'
      main_domain:
        description: 'Main domain for the worker'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Membuat package.json jika tidak ada
        id: check_package_json
        run: |
          if [ ! -f "package.json" ]; then
            echo "File package.json tidak ditemukan, membuat file baru..."
            npm init -y
            npm install wrangler@latest
          else
            echo "File package.json sudah ada."
          fi
          
      - name: Dynamic Wrangler.toml from customdomain.txt
        run: |
          # Buat header wrangler.toml menggunakan EOF agar lebih rapi
          cat <<EOF > wrangler.toml
          name = "${{ inputs.worker_name }}"
          main = "worker.js"
          compatibility_date = "2024-01-15"
          compatibility_flags = ["nodejs_compat"]
          workers_dev = true

          routes = [
            { pattern = "${{ inputs.main_domain }}", custom_domain = true },
          EOF

          # Loop melalui setiap domain dari customdomain.txt, lewati baris kosong
          # Pastikan file customdomain.txt ada, jika tidak ada buat kosong agar tidak error
          touch customdomain.txt
          while read -r domain || [[ -n "$domain" ]]; do
            # Hapus whitespace atau karakter carriage return (\r) dari Windows jika ada
            domain=$(echo "$domain" | tr -d '\r' | xargs)
            if [[ -n "$domain" ]]; then
              echo "  { pattern = \"$domain.${{ inputs.main_domain }}\", custom_domain = true }," >> wrangler.toml
            fi
          done < customdomain.txt

          # Tutup array dan tambahkan build section (TOML aman dengan koma di akhir elemen)
          cat <<EOF >> wrangler.toml
          ]

          [build]
          command = ""
          EOF
          
      - name: Display Wrangler.toml for debugging
        run: |
          echo "--- Generated wrangler.toml content ---"
          cat wrangler.toml
          echo "-------------------------------------"

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ inputs.cloudflare_api_token }}
          accountId: ${{ inputs.cloudflare_account_id }}
